<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Top 10</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
/* Layout: one-screen party app — marquee game-show board in the middle, the turn panel pinned under the thumb. */
:root{
  --ink:#15122e;
  --panel:#211d45;
  --panel2:#2d2860;
  --line:rgba(236,232,255,.13);
  --text:#f5f2ff;
  --muted:#aaa3d6;
  --accent:#ffc23d;
  --accent-ink:#2a1d00;
  --hit:#3fdc9c;
  --hit-ink:#032a1b;
  --miss:#ff5a6e;
  --miss-ink:#2e0309;
  --scrim:rgba(8,6,22,.72);
  --display:'Bungee','Arial Black',Impact,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
:root[data-mode="drinks"]{
  --ink:#1e0d1a;
  --panel:#2e1428;
  --panel2:#3f1c38;
  --muted:#d3a8c4;
  --accent:#ff8a4c;
  --accent-ink:#2b0d00;
  --scrim:rgba(18,5,14,.74);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
  transition:background .3s;
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;padding-block:16px 20px;display:flex;flex-direction:column;gap:18px}
.foot{padding-block:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--ink)}
h1,h2{margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:700;letter-spacing:.01em}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
button{font-family:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Buttons */
.btn{font:600 16px/1.2 var(--body);border:0;border-radius:14px;padding:14px 16px;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--miss);color:var(--miss-ink)}
.btn.hit{background:var(--hit);color:var(--hit-ink)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.quiet{background:transparent;color:var(--muted);min-height:40px;padding:8px 12px;font-size:14px;font-weight:500}
.btn.big{min-height:58px;font-size:17px}
.btn.sm{min-height:46px;padding:10px 14px;font-size:15px}
.btn small{display:block;font-weight:500;font-size:12px;opacity:.75}
.btn:active:not(:disabled){transform:scale(.98)}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.icon svg{width:22px;height:22px}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:6px}

/* Setup */
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding-top:6px}
.logo{position:relative;display:inline-flex;align-items:baseline;gap:10px;padding:16px 24px 14px;border-radius:20px}
.logo::before{content:"";position:absolute;inset:0;border-radius:20px;background:radial-gradient(circle,var(--accent) 0 2.6px,transparent 3.2px) 0 0/13px 13px;animation:twinkle 1.6s steps(2) infinite}
.logo::after{content:"";position:absolute;inset:8px;border-radius:13px;background:var(--panel)}
.logo>span{position:relative;z-index:1;font-family:var(--display);line-height:1}
.l-top{font-size:26px;color:var(--text)}
.l-10{font-size:54px;color:var(--accent)}
@keyframes twinkle{50%{opacity:.55}}
.tag{font-size:17px;font-weight:500;max-width:30ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;min-width:0}
input[type=text]{font:500 16px var(--body);color:var(--text);background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:46px;width:100%}
input[type=text]::placeholder{color:var(--muted);opacity:.8}
.names{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.names li{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:6px 6px 6px 12px;min-height:48px}
.names .seat{font-family:var(--display);font-size:15px;color:var(--accent);width:22px;text-align:center;font-variant-numeric:tabular-nums}
.names .nm{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.mini{width:38px;height:38px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.mini svg{width:18px;height:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--line);background:var(--ink);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:60px}
.seg button b{font-size:16px}
.seg button small{font-size:12.5px;color:var(--muted)}
.seg button.on{border-color:var(--accent);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--accent)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper .val{font-family:var(--display);font-size:34px;color:var(--accent);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--ink);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;min-height:40px}
.chip span{color:var(--muted);font-weight:500;margin-left:4px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.on span{color:var(--accent-ink);opacity:.7}

/* Game */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 0}
.topbar .rd{display:flex;flex-direction:column;gap:1px}
.topbar .rd b{font-family:var(--display);font-size:20px;line-height:1.1;font-weight:400}
.tb-actions{display:flex;gap:8px}
.top-card{background:var(--panel2);border-radius:18px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px}
.top-card h1{font-size:24px;line-height:1.15;font-weight:700}
.top-card .note{font-size:13px;color:var(--muted)}
.tc-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tc-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--ink);border-radius:999px;padding:8px 13px;min-height:40px;font-weight:600;font-size:14px}
.tc-btn svg{width:17px;height:17px}
.tc-btn.judge{border-color:var(--accent);color:var(--accent)}
.judge-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.board{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,auto);grid-auto-flow:column;gap:8px}
.slot{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 10px 7px 6px;min-height:48px;min-width:0}
.slot .num{font-family:var(--display);font-size:18px;color:var(--accent);width:30px;flex:none;text-align:center;font-variant-numeric:tabular-nums}
.slot .txt{font-weight:600;font-size:14px;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.slot.hid .txt{color:var(--muted);letter-spacing:.35em;opacity:.6}
.slot.on{border-color:var(--hit);background:color-mix(in srgb,var(--hit) 15%,var(--panel))}
.slot.on .num{color:var(--hit)}
.slot.miss .txt{color:var(--muted);font-weight:500}
.slot small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:0}
.pl{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 12px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:14px}
.pchip.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pchip.out{opacity:.42;text-decoration:line-through}
.pips{display:inline-flex;gap:3px}
.pips i{width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor;opacity:.7}
.pips i.f{background:currentColor;opacity:1}
.drink-note{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent);border-radius:12px;padding:10px 12px}
.drink-note svg{width:18px;height:18px;flex:none;color:var(--accent);margin-top:1px}
.turn .who{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.turn .who .nm{font-family:var(--display);font-size:30px;line-height:1.05;color:var(--accent);overflow-wrap:anywhere;min-width:0}
.turn .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Overlay + sheets */
#ov{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.sheet{width:min(520px,100%);max-height:92%;overflow-y:auto;background:var(--panel);border-radius:24px 24px 0 0;
  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
.sheet h2{font-size:21px;line-height:1.2}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet .stack{display:flex;flex-direction:column;gap:8px}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);align-self:center;margin-top:-6px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pick button{border:1px solid var(--line);background:var(--panel2);border-radius:14px;min-height:54px;font-weight:700;font-size:16px;padding:10px;overflow-wrap:anywhere}
.match{background:var(--panel2);border:1px solid var(--hit);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px}
.match .num{font-family:var(--display);font-size:30px;color:var(--hit)}
.match b{font-size:19px;overflow-wrap:anywhere}
.full{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.full button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 12px;min-height:48px;font-weight:600}
.full .num{font-family:var(--display);color:var(--accent);width:26px;text-align:center}
.full .tag2{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.verdict{border-radius:20px;padding:22px 18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.verdict.in{background:var(--hit);color:var(--hit-ink)}
.verdict.out{background:var(--miss);color:var(--miss-ink)}
.verdict.neutral{background:var(--panel2);color:var(--text)}
.verdict .big{font-family:var(--display);font-size:32px;line-height:1.05}
.verdict p{font-size:17px;font-weight:600}
.penalty{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:14px;padding:12px 14px;font-weight:700;font-size:16px}
.penalty svg{width:22px;height:22px;color:var(--accent);flex:none}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.rules li::marker{font-family:var(--display);color:var(--accent)}
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-list .btn{justify-content:flex-start;text-align:left}

/* Round end / champion */
.win-hero{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.win-hero .crown{width:46px;height:46px;color:var(--accent)}
.win-hero .nm{font-family:var(--display);font-size:clamp(34px,11vw,52px);line-height:1;color:var(--accent);overflow-wrap:anywhere}
.win-hero p{font-size:17px;font-weight:600}
.score{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.score li{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:12px;padding:10px 14px;min-height:48px}
.score .pos{font-family:var(--display);color:var(--muted);width:20px;text-align:center}
.score .nm{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.score .pts{font-family:var(--display);font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.score li.lead{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--accent)}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 196px);transform:translateX(-50%);background:var(--text);color:var(--ink);font-weight:700;padding:10px 16px;border-radius:999px;font-size:15px;z-index:30;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

/* ---------- Conferência de respostas ---------- */
const STOP = /\b(o|a|os|as|de|da|do|das|dos|e|the|of)\b/g;
function basic(s){
  return s.toLowerCase()
    .replace(/c\+\+/g,' c plus plus ').replace(/#/g,' sharp ').replace(/\+/g,' plus ')
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
}
function variants(s){ const b=basic(s); const st=b.replace(STOP,' ').replace(/\s+/g,' ').trim(); return [b, st||b]; }
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; }
  return prev[n];
}
function sim(a,b){
  if(!a||!b) return 0;
  if(a===b) return 1;
  if(Math.min(a.length,b.length)<=3) return 0;
  if(a.includes(b)||b.includes(a)) return 0.9;
  return 1-lev(a,b)/Math.max(a.length,b.length);
}
function findBest(typed, top){
  const tv=variants(typed); let best={idx:-1,score:0};
  top.a.forEach((names,idx)=>names.forEach(nm=>{
    const nv=variants(nm); const sc=Math.max(sim(tv[0],nv[0]),sim(tv[1],nv[1]));
    if(sc>best.score) best={idx,score:sc};
  }));
  return best.score>=0.78?best:null;
}

function savePrefs(){ try{ localStorage.setItem(LS, JSON.stringify({names:S.names,mode:S.mode,intensity:S.intensity,judge:S.judge,target:S.target,cats:S.cats,used:S.used})); }catch(e){} }
function snap(){ H.push(JSON.stringify({players:S.players,roundNo:S.roundNo,starterIdx:S.starterIdx,R:S.R,screen:S.screen,lastWinner:S.lastWinner})); if(H.length>60) H.shift(); }
function undo(){ const s=H.pop(); if(!s) return; Object.assign(S, JSON.parse(s)); S.sheet=null; toast('Ação desfeita'); render(); }

const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pName = id => (S.players.find(p=>p.id===id)||{}).name||'';
const curTop = () => TOPS[S.R.topId];
const goles = n => `${n} ${n>1?'goles':'gole'}`;
const drinks = () => S.mode==='drinks';

/* ---------- Lógica do jogo ---------- */
function deckPool(){ return TOPS.filter(t=>S.cats.includes(t.c)); }
function drawTop(){
  const pool=deckPool();
  let avail=pool.filter(t=>!S.used.includes(t.id));
  if(!avail.length){ S.used=S.used.filter(id=>!pool.some(t=>t.id===id)); avail=pool; }
  const pick=avail[Math.floor(Math.random()*avail.length)];
  S.used.push(pick.id); savePrefs();
  return pick.id;
}
function newRound(keepNumber){
  if(!keepNumber) S.roundNo++;
  const starter=S.players[S.starterIdx % S.players.length].id;
  S.R={topId:drawTop(), active:S.players.map(p=>p.id), out:[], turn:starter, starter, revealed:{}};
}
function nextAfter(id){
  const order=S.players.map(p=>p.id), n=order.length; const i=order.indexOf(id);
  for(let k=1;k<=n;k++){ const c=order[(i+k)%n]; if(S.R.active.includes(c)&&c!==id) return c; }
  return null;
}
function elim(id){ S.R.active=S.R.active.filter(x=>x!==id); S.R.out.push(id); }

function startMatch(){
  const names=S.names.filter(n=>n.trim());
  if(names.length<2) return;
  S.players=names.map((n,i)=>({id:'p'+i, name:n.trim(), pts:0}));
  S.roundNo=0; S.starterIdx=0; S.lastWinner=null; H=[];
  newRound(); S.screen='game'; S.sheet=null;
  requestWake(); render();
}
function answered(){
  snap(); const nx=nextAfter(S.R.turn); S.R.turn=nx; toast(`Vez de ${pName(nx)}`); render();
}
function leave(){
  snap(); const id=S.R.turn; elim(id); S.R.turn=nextAfter(id)||S.R.active[0];
  S.sheet={type:'result',kind:'leave',ans:id}; render();
}
function resolve(inTop, idx, repeat){
  snap(); const ans=S.R.turn, d=S.sheet.doubter;
  if(inTop){ S.R.revealed[idx]=ans; elim(d); S.R.turn=nextAfter(ans)||ans; S.sheet={type:'result',kind:'in',idx,ans,d}; }
  else { elim(ans); S.R.turn=nextAfter(ans)||S.R.active[0]; S.sheet={type:'result',kind:'out',ans,d,repeat:!!repeat,idx}; }
  render();
}
function afterResult(){
  S.sheet=null;
  if(S.R.active.length===1){
    const w=S.R.active[0]; const p=S.players.find(x=>x.id===w); p.pts++; S.lastWinner=w;
    S.screen = p.pts>=S.target ? 'champion' : 'roundEnd';
    if(navigator.vibrate) try{ navigator.vibrate(60); }catch(e){}
  }
  render();
}
function nextRound(){ snap(); S.starterIdx++; newRound(); S.screen='game'; render(); }
function skipTop(){ snap(); newRound(true); S.sheet=null; toast('Top pulado: novo tema na mesa'); render(); }
function playAgain(){ S.players.forEach(p=>p.pts=0); S.roundNo=0; S.starterIdx=0; S.lastWinner=null; H=[]; newRound(); S.screen='game'; render(); }
function toSetup(){ S.screen='setup'; S.sheet=null; H=[]; render(); }

async function requestWake(){ try{ if('wakeLock' in navigator && !wake){ wake=await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>{wake=null;}); } }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && S.screen!=='setup') requestWake(); });

let tt;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1500); }

/* ---------- Telas ---------- */
function pips(n){ let h='<span class="pips" aria-label="'+n+' de '+S.target+' pontos">'; for(let i=0;i<S.target;i++) h+=`<i class="${i<n?'f':''}"></i>`; return h+'</span>'; }

function vSetup(){
  const n=S.names.length, isEx=S.names.join()==EXAMPLE.join();
  const pool=deckPool().length;
  return `
  <div class="scroll">
    <header class="hero">
      <div class="logo" aria-label="Top 10"><span class="l-top">TOP</span><span class="l-10">10</span></div>
      <p class="tag">Diga uma resposta do ranking. Duvide se tiver coragem.</p>
    </header>

    <section class="card" aria-labelledby="h-pl">
      <div class="sec-h"><h2 id="h-pl">Jogadores</h2><span class="hint">${n} na roda</span></div>
      <div class="add-row">
        <input type="text" id="pname" maxlength="16" placeholder="Nome de quem vai jogar" autocomplete="off" enterkeyhint="done" aria-label="Nome do jogador">
        <button class="btn primary sm" data-act="addName">Adicionar</button>
      </div>
      <ol class="names">
        ${S.names.map((nm,i)=>`<li><span class="seat">${i+1}</span><span class="nm">${esc(nm)}</span>
          <button class="mini" data-act="nameUp" data-arg="${i}" ${i===0?'disabled':''} aria-label="Subir ${esc(nm)}">${I.up}</button>
          <button class="mini" data-act="nameDel" data-arg="${i}" aria-label="Remover ${esc(nm)}">${I.x}</button></li>`).join('')}
      </ol>
      <p class="hint">${isEx?'Nomes de exemplo: troque pelos da sua roda. ':''}A vez passa nesta ordem, como na roda.</p>
    </section>

    <section class="card" aria-labelledby="h-md">
      <h2 id="h-md">Modo</h2>
      <div class="seg">
        <button class="${S.mode==='classic'?'on':''}" data-act="mode" data-arg="classic" aria-pressed="${S.mode==='classic'}"><b>Clássico</b><small>Só a disputa</small></button>
        <button class="${S.mode==='drinks'?'on':''}" data-act="mode" data-arg="drinks" aria-pressed="${S.mode==='drinks'}"><b>Drinks</b><small>Quem sai da rodada, bebe</small></button>
      </div>
      ${drinks()?`
      <div class="seg">
        <button class="${S.intensity===1?'on':''}" data-act="intensity" data-arg="1"><b>Leve</b><small>1 gole por erro</small></button>
        <button class="${S.intensity===2?'on':''}" data-act="intensity" data-arg="2"><b>Forte</b><small>Tudo em dobro</small></button>
      </div>
      <p class="hint">Vale qualquer bebida, inclusive água. Beba com moderação e não dirija.</p>`:''}
    </section>

    <section class="card" aria-labelledby="h-jz">
      <h2 id="h-jz">Quem confere as respostas</h2>
      <div class="seg">
        <button class="${!S.judge?'on':''}" data-act="judge" data-arg="0" aria-pressed="${!S.judge}"><b>O app</b><small>Digita a resposta e o app confere sem mostrar a lista</small></button>
        <button class="${S.judge?'on':''}" data-act="judge" data-arg="1" aria-pressed="${S.judge}"><b>Um juiz</b><small>O juiz vê as 10 respostas e decide</small></button>
      </div>
      ${S.judge?'<p class="hint">O juiz não joga: deixe o nome dele fora da lista de jogadores e passe o celular para ele nas dúvidas.</p>':''}
    </section>

    <section class="card" aria-labelledby="h-pt">
      <h2 id="h-pt">Pontos para vencer</h2>
      <div class="stepper">
        <button class="icon" data-act="target" data-arg="-1" aria-label="Menos pontos" ${S.target<=1?'disabled':''}>${I.minus}</button>
        <span class="val" aria-live="polite">${S.target}</span>
        <button class="icon" data-act="target" data-arg="1" aria-label="Mais pontos" ${S.target>=7?'disabled':''}>${I.plus}</button>
        <span class="hint">Cada rodada vencida vale 1 ponto</span>
      </div>
    </section>

    <section class="card" aria-labelledby="h-tm">
      <div class="sec-h"><h2 id="h-tm">Temas</h2><button class="link" data-act="allCats">${S.cats.length===CATS.length?'Limpar':'Todos'}</button></div>
      <div class="chips">
        ${CATS.map(([k,l])=>`<button class="chip ${S.cats.includes(k)?'on':''}" data-act="cat" data-arg="${k}" aria-pressed="${S.cats.includes(k)}">${l}<span>${TOPS.filter(t=>t.c===k).length}</span></button>`).join('')}
      </div>
      <p class="hint">${pool} tops no baralho. Os já jogados ficam para o fim da fila.</p>
    </section>
  </div>
  <div class="foot">
    <button class="btn primary big" data-act="start" ${n<2||!pool?'disabled':''}>${n<2?'Adicione pelo menos 2 jogadores':!pool?'Escolha pelo menos um tema':'Começar partida'}</button>
    <button class="btn quiet" data-act="rules">Como jogar</button>
  </div>`;
}

function vBoard(revealAll){
  const t=curTop(); let h='<div class="board">';
  t.a.forEach((names,i)=>{
    const by=S.R.revealed[i];
    if(by!==undefined) h+=`<div class="slot on"><span class="num">${i+1}</span><span class="txt">${esc(names[0])}<small>${esc(pName(by))}</small></span></div>`;
    else if(revealAll) h+=`<div class="slot miss"><span class="num">${i+1}</span><span class="txt">${esc(names[0])}</span></div>`;
    else h+=`<div class="slot hid"><span class="num">${i+1}</span><span class="txt">•••</span></div>`;
  });
  return h+'</div>';
}

function vGame(){
  const t=curTop(), R=S.R;
  const count=Object.keys(R.revealed).length;
  return `
  <div class="topbar">
    <div class="rd"><span class="eyebrow">Rodada</span><b>${S.roundNo}</b></div>
    <div class="tb-actions">
      <button class="icon" data-act="undo" ${H.length?'':'disabled'} aria-label="Desfazer">${I.undo}</button>
      <button class="icon" data-act="menu" aria-label="Menu">${I.menu}</button>
    </div>
  </div>
  <div class="scroll">
    <section class="top-card">
      <span class="eyebrow">${CAT_LABEL[t.c]} · ${count}/10 confirmadas</span>
      <h1>${esc(t.t)}</h1>
      ${t.n?`<p class="note">${esc(t.n)}</p>`:''}
      <div class="tc-actions">
        <button class="tc-btn" data-act="askSkip">${I.skip}Pular este top</button>
        ${S.judge?`<button class="tc-btn judge" data-act="judgeView">${I.eye}Ver respostas (juiz)</button>`:''}
      </div>
    </section>
    ${vBoard(false)}
    <div class="pl" aria-label="Jogadores">
      ${S.players.map(p=>{ const out=!R.active.includes(p.id), cur=p.id===R.turn;
        return `<span class="pchip ${cur?'cur':''} ${out?'out':''}">${esc(p.name)} ${pips(p.pts)}</span>`; }).join('')}
    </div>
    ${drinks()?`<p class="drink-note">${I.glass}<span>Só bebe quem sai da rodada. Duvidaram e sua resposta não estava no Top 10: ${goles(S.intensity)}. Você duvidou e a resposta estava lá: ${goles(2*S.intensity)}. Passou, travou ou repetiu: ${goles(S.intensity)}.</span></p>`:''}
  </div>
  <div class="foot turn">
    <div class="who"><span class="nm">${esc(pName(R.turn))}</span><span class="eyebrow">sua vez</span></div>
    <div class="acts">
      <button class="btn primary big" data-act="answered">Respondeu</button>
      <button class="btn danger big" data-act="doubt">Alguém duvidou</button>
    </div>
    <button class="btn quiet" data-act="leave">Saiu da rodada (passou, travou ou repetiu)</button>
  </div>`;
}

function scoreList(){
  const arr=[...S.players].sort((a,b)=>b.pts-a.pts);
  const max=arr[0].pts;
  return `<ol class="score">${arr.map((p,i)=>`<li class="${p.pts===max&&max>0?'lead':''}"><span class="pos">${i+1}</span><span class="nm">${esc(p.name)}</span>${pips(p.pts)}<span class="pts">${p.pts}</span></li>`).join('')}</ol>`;
}

function vRoundEnd(){
  const w=S.lastWinner, nextStarter=S.players[(S.starterIdx+1)%S.players.length];
  return `
  <div class="scroll">
    <header class="win-hero">
      <span class="crown">${I.crown}</span>
      <span class="eyebrow">Rodada ${S.roundNo}</span>
      <span class="nm">${esc(pName(w))}</span>
      <p>ficou por último e ganha 1 ponto.</p>
    </header>
    ${drinks()?`<p class="penalty">${I.glass}<span>${esc(pName(w))} distribui ${goles(3*S.intensity)} para a roda.</span></p>`:''}
    <section class="card"><h2>Placar · vence com ${S.target}</h2>${scoreList()}</section>
    <section class="stack" style="display:flex;flex-direction:column;gap:10px">
      <h2>O Top 10 completo: ${esc(curTop().t)}</h2>
      ${vBoard(true)}
    </section>
  </div>
  <div class="foot">
    <button class="btn primary big" data-act="nextRound">Próxima rodada · começa ${esc(nextStarter.name)}</button>
    <button class="btn quiet" data-act="undo" ${H.length?'':'disabled'}>Desfazer o último lance</button>
  </div>`;
}

function vChampion(){
  const w=S.lastWinner;
  return `
  <div class="scroll">
    <header class="win-hero">
      <span class="crown">${I.crown}</span>
      <span class="eyebrow">Fim de partida</span>
      <span class="nm">${esc(pName(w))}</span>
      <p>fez ${S.target} ${S.target>1?'pontos':'ponto'} primeiro e venceu o Top 10.</p>
    </header>
    ${drinks()?`<p class="penalty">${I.glass}<span>Brinde final: todo mundo bebe ${goles(S.intensity)}, menos ${esc(pName(w))}.</span></p>`:''}
    <section class="card"><h2>Placar final</h2>${scoreList()}</section>
    <section style="display:flex;flex-direction:column;gap:10px">
      <h2>Último top: ${esc(curTop().t)}</h2>
      ${vBoard(true)}
    </section>
  </div>
  <div class="foot">
    <button class="btn primary big" data-act="playAgain">Jogar de novo com a mesma roda</button>
    <div class="acts" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <button class="btn ghost" data-act="toSetup">Mudar jogadores</button>
      <button class="btn ghost" data-act="undo" ${H.length?'':'disabled'}>Desfazer</button>
    </div>
  </div>`;
}

/* ---------- Folhas (sheets) ---------- */
function vSheet(){
  const s=S.sheet;
  if(s.type==='rules') return `<div class="sheet" role="dialog" aria-label="Como jogar"><div class="grab"></div>
    <h2>Como jogar</h2>
    <ol class="rules">
      <li>O app sorteia um tema com 10 respostas escondidas. A rodada começa por quem está na vez e segue a ordem da roda.</li>
      <li>Cada um diz em voz alta uma resposta que acha que está no Top 10. Ninguém duvidou? Toque em <b>Respondeu</b> e passa a vez.</li>
      <li>Se alguém duvidar, toque em <b>Alguém duvidou</b>, escolha quem duvidou e digite a resposta. O app confere sem mostrar o resto da lista.</li>
      <li>Está no Top 10: quem duvidou sai da rodada. Não está: quem respondeu sai.</li>
      <li>Quem passar, travar ou repetir uma resposta também sai.</li>
      <li>Tem juiz? Escolha <b>Um juiz</b> no início: ele vê as 10 respostas em <b>Ver respostas</b> e decide as dúvidas tocando na lista.</li>
      <li>O grupo não curtiu o tema? <b>Pular este top</b> sorteia outro e recomeça a rodada, sem mexer no placar.</li>
      <li>O último que sobrar ganha 1 ponto. Quem chegar a ${S.target} ${S.target>1?'pontos':'ponto'} primeiro vence a partida.</li>
    </ol>
    <h2 style="font-size:17px">Modo drinks</h2>
    <ol class="rules">
      <li>Só bebe quem sai da rodada, e só sai quem perdeu uma dúvida ou passou a vez. Se ninguém duvidar, a resposta vale e ninguém bebe.</li>
      <li>Alguém duvidou e a resposta não estava no Top 10: quem respondeu bebe 1 gole.</li>
      <li>Duvidou e a resposta estava no Top 10: quem duvidou bebe 2 goles. Duvidar custa caro.</li>
      <li>Passou, travou ou repetiu uma resposta: 1 gole.</li>
      <li>Quem vence a rodada distribui 3 goles. No fim, todo mundo brinda menos o campeão.</li>
      <li>No modo Forte, tudo em dobro. Vale água.</li>
    </ol>
    <p class="hint">Tocou errado? O botão de voltar no topo desfaz o último lance.</p>
    <button class="btn primary" data-act="close">Entendi</button></div>`;

  if(s.type==='menu') return `<div class="sheet" role="dialog" aria-label="Menu"><div class="grab"></div>
    <h2>Rodada ${S.roundNo}</h2>
    <div class="menu-list">
      <button class="btn ghost" data-act="undo" ${H.length?'':'disabled'}>Desfazer o último lance</button>
      <button class="btn ghost" data-act="askSkip">Pular este top</button>
      <button class="btn ghost" data-act="judgeView">Ver respostas (juiz)</button>
      <button class="btn ghost" data-act="judgeToggle">${S.judge?'Desligar modo juiz':'Ligar modo juiz'}</button>
      <button class="btn ghost" data-act="scores">Ver placar</button>
      <button class="btn ghost" data-act="rules">Como jogar</button>
      <button class="btn ghost" data-act="askQuit" style="color:var(--miss)">Encerrar partida</button>
    </div>
    <button class="btn quiet" data-act="close">Fechar</button></div>`;

  if(s.type==='scores') return `<div class="sheet" role="dialog" aria-label="Placar"><div class="grab"></div>
    <h2>Placar · vence com ${S.target}</h2>${scoreList()}
    <button class="btn primary" data-act="close">Voltar ao jogo</button></div>`;

  if(s.type==='quit') return `<div class="sheet" role="dialog" aria-label="Encerrar partida"><div class="grab"></div>
    <h2>Encerrar a partida?</h2><p class="muted">O placar atual será perdido. Os jogadores continuam salvos.</p>
    <div class="stack"><button class="btn danger" data-act="toSetup">Encerrar e voltar ao início</button>
    <button class="btn ghost" data-act="close">Continuar jogando</button></div></div>`;

  if(s.type==='skip'){
    const started=Object.keys(S.R.revealed).length>0 || S.R.out.length>0 || S.R.turn!==S.R.starter;
    return `<div class="sheet" role="dialog" aria-label="Pular top"><div class="grab"></div>
    <span class="eyebrow">${esc(curTop().t)}</span>
    <h2>Pular este top?</h2>
    <p class="muted">O app sorteia outro tema e a rodada ${started?'recomeça do zero, com todo mundo de volta, ':''}começando por ${esc(pName(S.R.starter))}. Ninguém ganha ou perde ponto.</p>
    <div class="stack"><button class="btn primary big" data-act="skipTop">Pular e sortear outro</button>
    <button class="btn ghost" data-act="close">Continuar com este</button></div></div>`;
  }
  if(s.type==='judge'){
    const t=curTop();
    return `<div class="sheet" role="dialog" aria-label="Respostas para o juiz"><div class="grab"></div>
    <span class="judge-tag">${I.eye} Só o juiz olha</span>
    <h2>${esc(t.t)}</h2>
    ${t.n?`<p class="hint">${esc(t.n)}</p>`:''}
    <ul class="full">${t.a.map((names,i)=>{ const by=S.R.revealed[i];
      return `<li><button tabindex="-1" style="cursor:default"><span class="num">${i+1}</span><span>${esc(names[0])}${names.length>1?`<small style="display:block;color:var(--muted);font-weight:500;font-size:12px">também vale: ${esc(names.slice(1).join(', '))}</small>`:''}</span>${by!==undefined?`<span class="tag2">já saiu · ${esc(pName(by))}</span>`:''}</button></li>`; }).join('')}</ul>
    <button class="btn primary" data-act="close">Esconder respostas</button></div>`;
  }
  if(s.type==='doubt') return vDoubt(s);
  if(s.type==='result') return vResult(s);
  return '';
}

function vDoubt(s){
  const ans=pName(S.R.turn), t=curTop();
  const head=`<div class="grab"></div><span class="eyebrow">${esc(t.t)}</span>`;
  if(s.step==='who'){
    const others=S.R.active.filter(id=>id!==S.R.turn);
    return `<div class="sheet" role="dialog" aria-label="Quem duvidou">${head}
      <h2>Quem duvidou de ${esc(ans)}?</h2>
      <div class="pick">${others.map(id=>`<button data-act="pickDoubter" data-arg="${id}">${esc(pName(id))}</button>`).join('')}</div>
      <button class="btn quiet" data-act="close">Cancelar</button></div>`;
  }
  if(s.step==='answer'){
    return `<div class="sheet" role="dialog" aria-label="Conferir resposta">${head}
      <h2>O que ${esc(ans)} respondeu?</h2>
      <p class="muted">${esc(pName(s.doubter))} duvidou. Digite a resposta para o app conferir sem mostrar a lista.</p>
      <input type="text" id="ans" placeholder="Digite a resposta" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" value="${esc(s.typed||'')}" aria-label="Resposta dita">
      <button class="btn primary big" data-act="check">Conferir</button>
      <button class="btn quiet" data-act="showList">Conferir na lista completa (mostra tudo)</button>
      <button class="btn quiet" data-act="close">Cancelar</button></div>`;
  }
  if(s.step==='match'){
    const idx=s.matchIdx, nm=t.a[idx][0], already=S.R.revealed[idx]!==undefined;
    return `<div class="sheet" role="dialog" aria-label="Resultado da busca">${head}
      <h2>${already?'Essa já tinha saído':'Achamos no Top 10'}</h2>
      <div class="match"><span class="num">${idx+1}</span><b>${esc(nm)}</b></div>
      ${already?`<p class="muted">${esc(pName(S.R.revealed[idx]))} já falou essa resposta. Resposta repetida tira ${esc(ans)} da rodada.</p>
        <div class="stack"><button class="btn danger big" data-act="confirmRepeat">Repetida: ${esc(ans)} sai</button>
        <button class="btn ghost" data-act="notThis">Não, era outra resposta</button></div>`
      :`<p class="muted">Foi isso que ${esc(ans)} quis dizer?</p>
        <div class="stack"><button class="btn hit big" data-act="confirmIn">Sim, está no Top 10</button>
        <button class="btn ghost" data-act="notThis">Não, era outra coisa</button></div>`}
      </div>`;
  }
  if(s.step==='nomatch'){
    return `<div class="sheet" role="dialog" aria-label="Não encontrada">${head}
      <h2>“${esc(s.typed)}” não aparece no Top 10</h2>
      <p class="muted">${s.retried?'Você indicou que não era a sugestão anterior.':'Nada parecido com essa resposta na lista.'} Se tiver dúvida de grafia, abra a lista completa.</p>
      <div class="stack"><button class="btn danger big" data-act="confirmOut">Confirmar: ${esc(ans)} sai</button>
      <button class="btn ghost" data-act="retype">Digitar de novo</button>
      <button class="btn quiet" data-act="showList">Conferir na lista completa (mostra tudo)</button></div></div>`;
  }
  if(s.step==='list'){
    return `<div class="sheet" role="dialog" aria-label="Lista completa">${head}
      <h2>${S.judge?'Juiz, ':''}toque na resposta de ${esc(ans)}</h2>
      <p class="muted">${S.judge?`${esc(pName(s.doubter))} duvidou. A lista inteira fica visível: só o juiz olha.`:'A lista inteira fica visível. Peça para só quem está conferindo olhar.'}</p>
      <ul class="full">${t.a.map((names,i)=>{ const by=S.R.revealed[i];
        return `<li><button data-act="listPick" data-arg="${i}"><span class="num">${i+1}</span><span>${esc(names[0])}</span>${by!==undefined?`<span class="tag2">já saiu</span>`:''}</button></li>`; }).join('')}</ul>
      <button class="btn danger big" data-act="confirmOut">Não está na lista: ${esc(ans)} sai</button>
      ${S.judge?`<button class="btn quiet" data-act="retype">Prefiro digitar a resposta</button>`:''}
      <button class="btn quiet" data-act="close">Cancelar</button></div>`;
  }
  return '';
}

function vResult(s){
  const t=curTop(), m=S.intensity;
  let cls, big, line, pen='';
  if(s.kind==='in'){ cls='in'; big='Tá no Top 10!'; line=`${esc(pName(s.d))} duvidou e sai da rodada.`; if(drinks()) pen=`${esc(pName(s.d))} bebe ${goles(2*m)}.`; }
  else if(s.kind==='out'){ cls='out'; big=s.repeat?'Repetida!':'Fora do Top 10!'; line=`${esc(pName(s.ans))} sai da rodada.`+(s.repeat?'':` ${esc(pName(s.d))} acertou na dúvida.`); if(drinks()) pen=`${esc(pName(s.ans))} bebe ${goles(m)}.`; }
  else { cls='neutral'; big='Saiu da rodada'; line=`${esc(pName(s.ans))} passou a vez e está fora até o fim da rodada.`; if(drinks()) pen=`${esc(pName(s.ans))} bebe ${goles(m)}.`; }
  const last=S.R.active.length===1;
  return `<div class="sheet" role="dialog" aria-label="Resultado">
    <div class="verdict ${cls}"><span class="big">${big}</span>
      ${s.kind==='in'?`<p>#${s.idx+1} ${esc(t.a[s.idx][0])}</p>`:''}
      <p>${line}</p></div>
    ${pen?`<p class="penalty">${I.glass}<span>${pen}</span></p>`:''}
    ${last?`<p class="muted">Só sobrou ${esc(pName(S.R.active[0]))}. Fim da rodada.</p>`:`<p class="muted">Agora é a vez de <b style="color:var(--text)">${esc(pName(S.R.turn))}</b>. Restam ${S.R.active.length} na rodada.</p>`}
    <button class="btn primary big" data-act="afterResult">${last?'Ver quem venceu':'Continuar'}</button>
    <button class="btn quiet" data-act="undo">Desfazer</button></div>`;
}

/* ---------- Render e eventos ---------- */
function render(){
  document.documentElement.dataset.mode=S.mode;
  const app=document.getElementById('app');
  const sc=app.querySelector('.scroll'); const keep=sc?sc.scrollTop:0; const sameScreen=app.dataset.screen===S.screen;
  app.dataset.screen=S.screen;
  app.innerHTML = S.screen==='setup'?vSetup():S.screen==='game'?vGame():S.screen==='roundEnd'?vRoundEnd():vChampion();
  if(sameScreen){ const n=app.querySelector('.scroll'); if(n) n.scrollTop=keep; }
  const ov=document.getElementById('ov');
  ov.innerHTML=S.sheet?vSheet():''; ov.hidden=!S.sheet;
  if(focusId){ const el=document.getElementById(focusId); if(el){ el.focus(); } focusId=null; }
}

const ACT = {
  addName(){ const el=document.getElementById('pname'); const v=(el.value||'').trim(); if(!v){ el.focus(); return; }
    if(S.names.join()==EXAMPLE.join()) S.names=[]; S.names.push(v.slice(0,16)); savePrefs(); focusId='pname'; render(); },
  nameDel(i){ S.names.splice(+i,1); savePrefs(); render(); },
  nameUp(i){ i=+i; if(i>0){ [S.names[i-1],S.names[i]]=[S.names[i],S.names[i-1]]; savePrefs(); render(); } },
  mode(m){ S.mode=m; savePrefs(); render(); },
  intensity(v){ S.intensity=+v; savePrefs(); render(); },
  target(d){ S.target=Math.min(7,Math.max(1,S.target+(+d))); savePrefs(); render(); },
  cat(k){ S.cats=S.cats.includes(k)?S.cats.filter(c=>c!==k):[...S.cats,k]; savePrefs(); render(); },
  allCats(){ S.cats=S.cats.length===CATS.length?[]:CATS.map(c=>c[0]); savePrefs(); render(); },
  start(){ startMatch(); },
  rules(){ S.sheet={type:'rules'}; render(); },
  menu(){ S.sheet={type:'menu'}; render(); },
  scores(){ S.sheet={type:'scores'}; render(); },
  askQuit(){ S.sheet={type:'quit'}; render(); },
  close(){ S.sheet=null; render(); },
  undo(){ undo(); },
  answered(){ answered(); },
  leave(){ leave(); },
  doubt(){ const others=S.R.active.filter(id=>id!==S.R.turn);
    if(others.length===1) ACT.pickDoubter(others[0]);
    else { S.sheet={type:'doubt',step:'who'}; render(); } },
  pickDoubter(id){ S.sheet={type:'doubt',step:S.judge?'list':'answer',doubter:id,typed:''}; if(!S.judge) focusId='ans'; render(); },
  judge(v){ S.judge=v==='1'; savePrefs(); render(); },
  judgeToggle(){ S.judge=!S.judge; savePrefs(); S.sheet=null; toast(S.judge?'Modo juiz ligado':'Modo juiz desligado'); render(); },
  judgeView(){ S.sheet={type:'judge'}; render(); },
  askSkip(){ S.sheet={type:'skip'}; render(); },
  check(){ const el=document.getElementById('ans'); const v=(el&&el.value||'').trim(); S.sheet.typed=v;
    if(!v){ focusId='ans'; render(); return; }
    const b=findBest(v, curTop());
    if(b){ S.sheet.step='match'; S.sheet.matchIdx=b.idx; } else { S.sheet.step='nomatch'; S.sheet.retried=false; }
    render(); },
  notThis(){ S.sheet.step='nomatch'; S.sheet.retried=true; render(); },
  retype(){ S.sheet.step='answer'; focusId='ans'; render(); },
  showList(){ S.sheet.step='list'; render(); },
  listPick(i){ i=+i; S.sheet.matchIdx=i; S.sheet.step='match'; render(); },
  confirmIn(){ resolve(true, S.sheet.matchIdx); },
  confirmOut(){ resolve(false, null, false); },
  confirmRepeat(){ resolve(false, S.sheet.matchIdx, true); },
  afterResult(){ afterResult(); },
  skipTop(){ skipTop(); },
  nextRound(){ nextRound(); },
  playAgain(){ playAgain(); },
  toSetup(){ toSetup(); }
};

document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]');
  if(b){ if(b.disabled) return; const f=ACT[b.dataset.act]; if(f) f(b.dataset.arg); return; }
  if(e.target.id==='ov' && S.sheet && S.sheet.type!=='result'){ S.sheet=null; render(); }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    if(e.target.id==='pname'){ e.preventDefault(); ACT.addName(); }
    else if(e.target.id==='ans'){ e.preventDefault(); ACT.check(); }
  }
  if(e.key==='Escape' && S.sheet && S.sheet.type!=='result'){ S.sheet=null; render(); }
});
document.addEventListener('input', e=>{ if(e.target.id==='ans' && S.sheet) S.sheet.typed=e.target.value; });

/* ---------- Inicialização (preserva a partida em atualizações da página) ---------- */
function start(data){
  if(data && data.S){ S=Object.assign(S,data.S); H=data.H||[]; }
  render();
}
try{ window.claude?.hot?.snapshot?.(()=>({S,H})); }catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}</script>
